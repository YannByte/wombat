name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify release source
    if: ${{ github.event.repository.private == false }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Require a matching version, main ancestry and successful prior CI
        id: candidate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)throw new Error("tag "+process.env.GITHUB_REF_NAME+" does not match package "+p.version)'
          default_branch=$DEFAULT_BRANCH
          git fetch --no-tags origin "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$default_branch" || {
            echo "Tagged commit $GITHUB_SHA is not on $default_branch" >&2
            exit 1
          }
          ci_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch "$default_branch" --event push --status success --limit 1 --json conclusion,status,databaseId --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId')
          test -n "$ci_run" || {
            echo "No successful CI push run found for $GITHUB_SHA on $default_branch" >&2
            exit 1
          }
          release_error="$RUNNER_TEMP/wombat-release-lookup.txt"
          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>"$release_error"; then
            echo "Release $GITHUB_REF_NAME already exists and will not be replaced" >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi
          node scripts/ci-release-candidate.ts --run "$ci_run" --output "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Release
    if: ${{ github.event.repository.private == false }}
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          run-id: ${{ needs.preflight.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: candidate
      - name: Verify reused archive identity and hashes
        run: node scripts/check-release-assets.ts candidate
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/wombat-*.tar.gz
      - name: Generate English release notes from the verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm release:notes -- --set candidate/release-set.json --output candidate/RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: candidate/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            candidate/wombat-*.tar.gz
            candidate/SHA256SUMS
            candidate/release-set.json
            scripts/install/install.sh
            scripts/install/install.ps1
      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
