name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Verification scope
        type: choice
        options:
          - all
          - win32-x64
          - published-release
        default: all
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-published:
    name: Verify public installation and update
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'published-release' }}
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Verify the published assets and public installation route
        env:
          GH_TOKEN: ${{ github.token }}
          WOMBAT_RELEASE_CACHE: ${{ runner.temp }}/wombat-release-cache
        run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm release:publish -- --verify-published

  repository:
    name: Repository rules before build
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          corepack pnpm repo:check

  prebuild:
    name: Source-only checks on ${{ matrix.runner }}
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Check platform assumptions without built artifacts
        run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          corepack pnpm test:repo
          corepack pnpm test:prebuild

  verify:
    name: Verify ${{ matrix.target }}
    needs: [repository, prebuild]
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: win32-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WOMBAT_AUTO_PRICES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Install locked tools and dependencies
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/wombat-source" >> "$GITHUB_ENV"
          echo "WOMBAT_DATA_HOME=$RUNNER_TEMP/wombat-data" >> "$GITHUB_ENV"
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          rustup show
          rustup component add rustfmt clippy
          cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Inventory native dependencies on this target
        if: matrix.target != 'darwin-arm64'
        run: corepack pnpm licenses:generate
      - name: Release gate
        run: corepack pnpm release:check
      - name: Export core, bundled runtime and notices
        run: corepack pnpm native:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/native-artifacts/
          if-no-files-found: error
          retention-days: 1

  verify-windows:
    name: Windows installation candidate
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.target == 'win32-x64' }}
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      WOMBAT_AUTO_PRICES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Install locked tools and dependencies
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/wombat-source" >> "$GITHUB_ENV"
          echo "WOMBAT_DATA_HOME=$RUNNER_TEMP/wombat-data" >> "$GITHUB_ENV"
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          rustup show
          rustup component add rustfmt clippy
          cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Inventory native dependencies on this target
        run: corepack pnpm licenses:generate
      - name: Focused Windows installation and upgrade acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: corepack pnpm release:verify-install

  github-candidate:
    name: Assemble GitHub Release candidate
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true
      - name: Assemble the five self-contained archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm github:pack -- --native-dir native-artifacts --reuse-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-candidate
          path: dist/github/
          if-no-files-found: error
          retention-days: 1

  install-candidate:
    name: Install archive on ${{ matrix.target }}
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    needs: github-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-candidate
          path: candidate
      - name: Prepare upgrade acceptance dependencies
        run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @wombat/client build
      - name: Exercise the exact self-contained archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-release.ts --set candidate/release-set.json

  dependency-audit:
    name: Dependency advisories
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - run: |
          npm install --global corepack@0.33.0 --force
          corepack pnpm install --frozen-lockfile
          corepack pnpm audit --audit-level moderate
          cargo install --locked cargo-audit --version 0.22.2
          if cargo tree --locked --manifest-path core/Cargo.toml --target all | grep -Eq '(^|[[:space:]])rkyv v'; then
            echo 'rkyv became reachable; remove the advisory exception and upgrade it before merging.' >&2
            exit 1
          fi
          # rust_decimal lists rkyv as an optional dependency, but Wombat does not
          # enable that feature. The guard above turns this exception into a failure
          # if the vulnerable crate ever enters the build graph.
          cargo audit --file core/Cargo.lock --ignore RUSTSEC-2026-0235
